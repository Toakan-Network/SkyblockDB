plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
	id 'maven-publish'
}

// One jar per Minecraft version (-Pmc=26.3; default in gradle.properties), each bundling only the matching
// SkyblockAPI build. The version's settings come from versions/<mc>.properties.
def mcProps = new Properties()
file("versions/${project.mc}.properties").withInputStream { mcProps.load(it) }
mcProps.each { key, value -> ext.set(key, value) }

version = "${project.mod_version}+${project.mc}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://repo.hypixel.net/repository/Hypixel/" }
	// SkyblockAPI (ThatGravyBoat): sacks, storage, profile and repo data, bundled below.
	maven {
		url = "https://maven.teamresourceful.com/repository/maven-public/"
		content { excludeModule("tech.thatgravyboat", "skyblock-api") }
	}
	// SkyblockAPI's own jars, fetched as plain files: its Gradle variant metadata would pick one Minecraft build,
	// and we bundle two (26.2 and 26.3).
	exclusiveContent {
		forRepository {
			ivy {
				name = "SkyblockAPI jars"
				url = "https://maven.teamresourceful.com/repository/maven-public/"
				patternLayout {
					artifact "[organisation]/[module]/[revision]/[module]-[revision](-[classifier]).[ext]"
					m2compatible = true
				}
				metadataSources { artifact() }
			}
		}
		filter { includeModule("tech.thatgravyboat", "skyblock-api") }
	}
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Official Hypixel Mod API, used for SkyBlock detection. Required at runtime ("depends" in
	// fabric.mod.json); players install the hypixel-mod-api mod themselves, so it is compile-only, not bundled.
	compileOnly "net.hypixel:mod-api:1.0.2"

	// SkyblockAPI: the data source. One build per Minecraft version; only the one for this jar's version is
	// bundled with Jar-in-Jar (Fabric loads the newest copy when other mods bundle it too). Needs
	// fabric-language-kotlin. Picked by file classifier, which bypasses its variant metadata.
	implementation "tech.thatgravyboat:skyblock-api:4.2.37:${project.mc}@jar"
	include "tech.thatgravyboat:skyblock-api:4.2.37:${project.mc}@jar"
	// Compile against what SkyblockAPI exposes: Repo-Lib (nested in its jar) and the Kotlin standard library
	// (from fabric-language-kotlin, installed by the player).
	compileOnly "tech.thatgravyboat.repo-lib:repo-lib:4.1.11"
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"

	// MVStore (from H2): the internal store, pure Java and about 370 KB. Bundled with Jar-in-Jar.
	implementation "com.h2database:h2-mvstore:2.5.252"
	include "com.h2database:h2-mvstore:2.5.252"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", project.minecraft_range

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": project.minecraft_range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from("NOTICE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	from("THIRD_PARTY_NOTICES.txt") {
		rename { "THIRD_PARTY_NOTICES_${project.base.archivesName.get()}.txt"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
