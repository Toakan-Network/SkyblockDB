# Builds the mod (a jar per Minecraft version) on every push to main and on pull requests, and uploads the jars.

name: build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  pull_request:
    paths:
      - 'src/**'
      - 'versions/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
  schedule:
    - cron: '27 17 * * *'
  workflow_call:
  workflow_dispatch:

# Only reads the repository; artifact uploads don't use the token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: setup jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build for 26.2
        run: ./gradlew build -Pmc=26.2
      - name: build for 26.3
        run: ./gradlew build -Pmc=26.3
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
